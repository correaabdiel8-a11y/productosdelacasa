<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>La Casa del Cheff · Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --surface:#0e0e0e;
    --line:#2a2417;
    --gold:#d4af37;
    --gold-soft:#a98c2f;
    --text:#f3ecd9;
    --muted:#9a937f;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;scroll-padding-top:128px}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.4;
    padding:0 0 env(safe-area-inset-bottom,0px);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  /* Encabezado */
  header{
    text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 34px) 18px 22px;
    border-bottom:1px solid var(--line);
    background:radial-gradient(120% 90% at 50% 0%,#1b1608 0%,#000 70%);
  }
  .logo{display:block;margin:0 auto 6px;width:min(62vw,250px);height:auto}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .brand{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:.04em;color:var(--gold);line-height:1.05}
  .tagline{margin-top:6px;font-size:13px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .intro{margin-top:14px;font-size:14px;color:var(--muted)}

  /* Barra fija: buscador + categorías */
  .sticky{
    position:sticky;top:0;z-index:10;
    background:rgba(0,0,0,.94);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding-top:env(safe-area-inset-top,0px);
    border-bottom:1px solid var(--line);
  }
  .search{padding:12px 18px 8px;max-width:560px;margin:0 auto;position:relative}
  .search input{
    width:100%;height:46px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    font:inherit;font-size:16px;padding:0 44px 0 16px;outline:none;
    transition:border-color .2s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--gold)}
  .clear{
    position:absolute;right:26px;top:50%;transform:translateY(-35%);
    width:32px;height:32px;border:0;background:none;color:var(--gold);
    font-size:22px;line-height:1;display:none;cursor:pointer;
  }
  .clear.on{display:block}
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:6px 18px 12px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);
    font:inherit;font-size:14px;padding:8px 15px;border-radius:999px;cursor:pointer;
    transition:color .2s,border-color .2s,background .2s;white-space:nowrap;
  }
  .chip.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:500}

  /* Categorías y productos */
  main{padding-bottom:40px}
  section.cat{padding-top:30px}
  section.cat h2{
    font-family:var(--serif);font-weight:600;font-size:28px;color:var(--gold);
    letter-spacing:.02em;margin-bottom:6px;
    display:flex;align-items:center;gap:14px;
  }
  section.cat h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent)}
  .item{padding:13px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .row{display:flex;align-items:baseline;gap:10px}
  .name{font-size:17px;font-weight:500}
  .dots{flex:1;border-bottom:1px dotted #4a4128;transform:translateY(-4px);min-width:12px}
  .price{
    font-family:var(--serif);font-weight:700;font-size:22px;color:var(--gold);
    font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;
  }
  .variants{margin-top:3px;font-size:13.5px;color:var(--muted);max-width:92%}
  .opt{display:flex;align-items:baseline;gap:10px;margin-top:6px}
  .opt .oname{font-size:14.5px;color:var(--muted)}
  .opt .price{font-size:20px}
  mark{background:none;color:var(--gold);text-decoration:underline;text-underline-offset:3px}

  .empty{display:none;text-align:center;padding:60px 10px;color:var(--muted)}
  .empty.on{display:block}
  .empty strong{display:block;font-family:var(--serif);font-size:24px;color:var(--text);margin-bottom:6px}

  footer{text-align:center;padding:26px 18px calc(env(safe-area-inset-bottom,0px) + 34px);border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
  footer .f-brand{font-family:var(--serif);font-size:18px;color:var(--gold);margin-bottom:4px}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<header>
  <img id="logo" class="logo" alt="" hidden>
  <div class="brand" id="brandName">La Casa del Cheff</div>
  <div class="tagline" id="tagline">Panadería boutique</div>
  <p class="intro" id="intro"></p>
</header>

<div class="sticky">
  <div class="search">
    <input id="q" type="search" placeholder="Buscar producto" autocomplete="off" aria-label="Buscar producto">
    <button class="clear" id="clear" aria-label="Borrar búsqueda">&times;</button>
  </div>
  <nav class="chips" id="chips" aria-label="Categorías"></nav>
</div>

<main class="wrap" id="menu"></main>
<div class="empty wrap" id="empty"><strong>Sin resultados</strong>Prueba con otra palabra o revisa las categorías.</div>

<footer>
  <div class="f-brand" id="fBrand"></div>
  <div id="fNote"></div>
</footer>

/* =====================================================
   LÓGICA (no necesitas tocar esto)
   ===================================================== */
const $ = s => document.querySelector(s);
const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const money = n => "$" + n;
const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = (t,i) => "cat-" + i;

// Encabezado y pie
$("#brandName").textContent = CONFIG.nombre;
$("#fBrand").textContent = CONFIG.nombre;
$("#fNote").textContent = CONFIG.nota;
$("#intro").textContent = CONFIG.intro;
document.title = CONFIG.nombre + " · Precios";
if (CONFIG.logo) {
  const l = $("#logo"); l.src = CONFIG.logo; l.alt = CONFIG.nombre + " · Panadería boutique"; l.hidden = false;
  // el logo ya trae el nombre: el texto queda solo para lectores de pantalla
  $("#brandName").classList.add("sr-only"); $("#tagline").classList.add("sr-only");
}

function hl(text, q){
  if(!q) return esc(text);
  const nt = norm(text), i = nt.indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}

function itemHTML(it, q){
  let h = '<div class="item">';
  if(it.o){
    h += '<div class="row"><span class="name">'+hl(it.n,q)+'</span></div>';
    it.o.forEach(([l,p]) => {
      h += '<div class="opt"><span class="oname">'+esc(l)+'</span><span class="dots"></span><span class="price">'+money(p)+'</span></div>';
    });
  } else {
    h += '<div class="row"><span class="name">'+hl(it.n,q)+'</span><span class="dots"></span><span class="price">'+money(it.p)+'</span></div>';
    if(it.v) h += '<div class="variants">'+it.v.map(v => hl(v,q)).join(" · ")+'</div>';
  }
  return h + '</div>';
}

function matches(it, q){
  if(!q) return true;
  const pool = [it.n].concat(it.v || [], (it.o || []).map(o => o[0]));
  return pool.some(t => norm(t).includes(q));
}

function render(){
  const q = norm($("#q").value.trim());
  $("#clear").classList.toggle("on", !!q);
  let html = "", chips = "", total = 0;
  MENU.forEach((c,i) => {
    // si la categoría coincide con la búsqueda, se muestra completa
    const catHit = q && norm(c.cat).includes(q);
    const items = c.items.filter(it => catHit || matches(it,q));
    if(!items.length) return;
    total += items.length;
    html += '<section class="cat" id="'+slug(c.cat,i)+'"><h2>'+esc(c.cat)+'</h2>'
         + items.map(it => itemHTML(it, catHit ? "" : q)).join("") + '</section>';
    chips += '<button class="chip" data-t="'+slug(c.cat,i)+'">'+esc(c.cat)+'</button>';
  });
  $("#menu").innerHTML = html;
  $("#chips").innerHTML = chips;
  $("#empty").classList.toggle("on", total === 0);
  bindChips(); observe();
}

function bindChips(){
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    const el = document.getElementById(b.dataset.t);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }));
}

let io;
function observe(){
  if(io) io.disconnect();
  const secs = [...document.querySelectorAll("section.cat")];
  if(!secs.length) return;
  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.t === e.target.id));
        const a = document.querySelector(".chip.active");
        if(a) a.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
      }
    });
  }, {rootMargin:"-140px 0px -65% 0px"});
  secs.forEach(s => io.observe(s));
  const first = document.querySelector(".chip");
  if(first && !document.querySelector(".chip.active")) first.classList.add("active");
}

$("#q").addEventListener("input", render);
$("#clear").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });
render();
</script>
